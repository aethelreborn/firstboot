version: 2
builds:
  - main: ./cmd/firstboot
    binary: firstboot
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    name_template: 'firstboot_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
release:
  prerelease: auto
